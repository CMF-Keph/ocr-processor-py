<main class="max-w-xl flex flex-col gap-4">
  <textarea [value]="this.latestText()!.text || 'Aún no hay ningún texto'" class=" bg-gray-700 hover:bg-gray-900 border border-gray-500 rounded-sm p-2"></textarea>
  <div class="flex flex-col gap-1">
    @for (text of this.texts(); track text.id) {
      <p class="text-sm hover:bg-gray-900 p-2 rounded">{{text.text}}</p>
    }
  </div>
</main>
